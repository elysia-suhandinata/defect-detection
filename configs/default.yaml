seed: 42
num_classes: 4
image_height: 256
image_width: 1600
patch_size: 128

data:
  raw_root: data/severstal-steel-defect-detection
  splits_dir: data/splits
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  rare_class_id: 2

segmenter:
  base_channels: 32
  epochs: 30
  batch_size: 4
  lr: 1.0e-4
  weight_decay: 1.0e-5
  num_workers: 2
  dice_weight: 1.0
  bce_weight: 1.0
  class_weights: [1.0, 4.0, 1.0, 2.0]  # ClassId 1..4; boost rare Class 2

augmentation:
  hflip_prob: 0.5
  brightness: 0.15
  contrast: 0.15
  copy_paste_prob: 0.5

generator:
  latent_dim: 64
  epochs: 50
  batch_size: 16
  lr: 2.0e-4
  num_candidates: 500
  num_selected: 100
  mix_ratios: [0.0, 0.25, 0.5, 1.0]
  diffusion_timesteps: 200
  diffusion_base_channels: 64
  style_dim: 128
  stylegan_base_channels: 256

selection:
  metric: rare_dice
  search: grid

cost_model:
  fn_cost: 10.0
  fp_cost: 1.0

report:
  mode: template

runs_dir: runs
device: cuda
